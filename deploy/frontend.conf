server {
    listen 127.0.0.1:18788;
    server_name _;
    root /usr/local/openresty/nginx/html;

    location ^~ /zh/api/ {
        proxy_pass http://127.0.0.1:18787/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /zh/ {
        try_files $uri $uri/ /zh/index.html;
    }
}
